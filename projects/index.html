<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Projects - Alexis Carella" />
    <meta name="author" content="Alexis Carella" />
    <title>Projects - Alexis Carella</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
    <link href="../css/styles.css" rel="stylesheet" />
    <style>
        .project-card { margin-bottom: 2rem; }
        .project-card h3 { margin-bottom: 0.25rem; }
        .project-card .subheading { font-size: 0.9rem; margin-bottom: 0.5rem; }
        .project-card ul { margin-top: 0.5rem; }
        .top-actions {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
            display: flex;
            gap: 0.5rem;
        }
        .top-actions button {
            background: #bd5d38;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            line-height: 1;
        }
        .top-actions button:hover {
            background: #a84f2f;
        }
        @media (max-width: 991.98px) {
            .top-actions {
                top: 0.6rem;
                right: 4rem;
            }
            .top-actions button {
                padding: 0.3rem 0.6rem;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body id="page-top">
    <div class="top-actions">
        <button id="downloadMD" onclick="downloadMD()" title="Download CV as Markdown"><i class="fas fa-download"></i></button>
        <button id="langToggle" onclick="switchLanguage()">FR</button>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
        <a class="navbar-brand js-scroll-trigger" href="../index.html">
            <span class="d-block d-lg-none">Alexis Carella</span>
            <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="../assets/img/profile.png?v=2" alt="" /></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="../index.html" id="backLink">&#8592; Back to CV</a></li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <section class="resume-section" id="projects">
            <div class="resume-section-content" id="projectsContent">
                <h2 class="mb-5">Projects</h2>
                <p class="text-muted">Loading...</p>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
    <script>
    let currentLang = 'en';
    let resumeData = null;

    function detectBrowserLang() {
        const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
        return lang === 'fr' ? 'fr' : 'en';
    }

    function loadJSON(url) {
        return fetch(url).then(r => {
            if (!r.ok) throw new Error('Failed to load ' + url);
            return r.json();
        });
    }

    function switchLanguage() {
        const next = currentLang === 'en' ? 'fr' : 'en';
        currentLang = next;
        document.getElementById('langToggle').textContent = next === 'en' ? 'FR' : 'EN';
        document.documentElement.lang = next;
        renderProjects();
        // Collapse navbar on mobile
        const toggler = document.querySelector('.navbar-toggler');
        const collapse = document.getElementById('navbarResponsive');
        if (toggler && collapse && window.getComputedStyle(toggler).display !== 'none') {
            const bsCollapse = bootstrap.Collapse.getInstance(collapse);
            if (bsCollapse) bsCollapse.hide();
        }
    }

    function renderProjects() {
        const suffix = currentLang === 'fr' ? '-fr' : '-en';
        loadJSON('../data/resume' + suffix + '.json').then(data => {
            resumeData = data;
            const container = document.getElementById('projectsContent');
            const langData = currentLang === 'fr' ? 'fr' : 'en';
            const backLabel = langData === 'fr' ? '&#8592; Retour au CV' : '&#8592; Back to CV';
            document.getElementById('backLink').innerHTML = backLabel;

            container.innerHTML = '<h2 class="mb-5">Projects</h2>' +
                data.projects.map(p =>
                    '<div class="project-card">' +
                        '<h3>' + p.title + '</h3>' +
                        '<div class="subheading text-primary">' + p.stack + '</div>' +
                        '<p>' + p.description + '</p>' +
                        (p.url ? '<p><a href="' + p.url + '" target="_blank"><i class="fab fa-github"></i> ' + p.urlLabel + '</a></p>' : '') +
                            (p.articleUrl ? '<p><a href="' + p.articleUrl + '" target="_blank"><i class="fas fa-newspaper"></i> ' + p.articleLabel + '</a></p>' : '') +
                    '</div>' +
                    (data.projects.indexOf(p) < data.projects.length - 1 ? '<hr class="m-0 mb-4" />' : '')
                ).join('');
        });
    }

    function downloadMD() {
        const d = resumeData;
        if (!d) return;

        let md = '# ' + d.about.firstName + ' ' + d.about.lastName + '\n\n';
        md += '**' + d.about.location + '**  \n';
        md += '<' + d.about.email + '>  \n';
        md += '[LinkedIn](' + d.about.linkedin + ') | [GitHub](' + d.about.github + ')\n\n';
        md += d.about.bio + '\n\n---\n\n';

        const expLabel = d.nav.items.find(i => i.id === 'experience').label;
        md += '## ' + expLabel + '\n\n';
        d.experience.forEach(job => {
            md += '### ' + job.title + '\n\n';
            md += '**' + job.company + '**  \n' + job.period + '\n\n';
            job.bullets.forEach(b => {
                const clean = b.replace(/<\/?strong>/g, '**').replace(/<\/?[^>]+>/g, '');
                md += '- ' + clean + '\n';
            });
            md += '\n';
        });

        md += '---\n\n## ' + d.nav.items.find(i => i.id === 'education').label + '\n\n';
        d.education.forEach(edu => {
            md += '### ' + edu.school + '\n\n**' + edu.degree + '**  \n' + edu.detail + '  \n' + edu.period + '\n\n';
            edu.bullets.forEach(b => md += '- ' + b + '\n');
            md += '\n';
        });

        if (d.formations && d.formations.length > 0) {
            const formLabel = currentLang === 'fr' ? 'Formations professionnelles' : 'Professional Training';
            md += '### ' + formLabel + '\n\n';
            d.formations.forEach(f => {
                md += '**' + f.title + '**  \n' + f.provider + '  \n' + f.detail + '  \n' + f.period + '\n';
                if (f.url) md += '<' + f.url + '>\n';
                md += '\n';
            });
        }

        const skillsLabel = d.nav.items.find(i => i.id === 'skills').label;
        md += '---\n\n## ' + skillsLabel + '\n\n';
        d.skills.groups.forEach(g => {
            md += '### ' + g.title + '\n\n';
            g.items.forEach(item => md += '- ' + item + '\n');
            md += '\n';
        });

        md += '---\n\n## ' + d.nav.items.find(i => i.id === 'certifications').label + '\n\n';
        d.certifications.forEach(c => md += '- ' + c.name + '\n');

        const projLabel = d.nav.items.find(i => i.id === 'projects').label;
        md += '\n---\n\n## ' + projLabel + '\n\n';
        d.projects.forEach(p => {
            md += '### ' + p.title + '\n\n**' + p.stack + '**\n\n' + p.description + '\n\n';
            if (p.url) md += 'GitHub: <' + p.url + '>\n';
            if (p.articleUrl) md += 'Article: <' + p.articleUrl + '>\n';
            md += '\n';
        });

        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Alexis-Carella-CV-' + currentLang.toUpperCase() + '.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    currentLang = detectBrowserLang();
    document.getElementById('langToggle').textContent = currentLang === 'en' ? 'FR' : 'EN';
    document.documentElement.lang = currentLang;
    renderProjects();
    </script>
</body>
</html>
