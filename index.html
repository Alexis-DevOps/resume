<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Alexis Carella - DevOps / Platform Engineer. Kubernetes, observability, security (ISO 27001 / DORA / MiCA), GitOps, FinOps." />
        <meta name="author" content="Alexis Carella" />
        <title>CV - Alexis Carella</title>
        <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet" type="text/css" />
        <link href="css/styles.css" rel="stylesheet" />
        <style>
          .formation-card {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #dee2e6;
          }
          .formation-card:first-child {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
          }
          .formation-card h3 {
            margin-bottom: 0.25rem;
          }
          .project-card h3 { margin-bottom: 0.25rem; }
          .project-card .subheading { font-size: 0.9rem; margin-bottom: 0.5rem; }
          .text-loading {
            opacity: 0.3;
            transition: opacity 0.3s;
          }
          .text-loaded {
            opacity: 1;
          }
          .top-actions {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
            display: flex;
            gap: 0.5rem;
          }
          .top-actions button {
            background: #bd5d38;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            line-height: 1;
          }
          .top-actions button:hover {
            background: #a84f2f;
          }
          @media (max-width: 991.98px) {
            .top-actions {
              top: 0.6rem;
              right: 4rem;
            }
            .top-actions button {
              padding: 0.3rem 0.6rem;
              font-size: 0.78rem;
            }
          }
        </style>
    </head>
    <body id="page-top">
        <div class="top-actions">
            <button id="downloadMD" onclick="downloadMD()" title="Download CV as Markdown"><i class="fas fa-download"></i></button>
            <button id="langToggle" onclick="switchLanguage()">FR</button>
        </div>

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <span class="d-block d-lg-none" id="navBrandMobile">Alexis Carella</span>
                <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="assets/img/profile.png?v=2" alt="" /></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav" id="navList">
                </ul>
            </div>
        </nav>

        <div class="container-fluid p-0" id="mainContent">
            <section class="resume-section" id="about">
                <div class="resume-section-content" id="aboutContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="experience">
                <div class="resume-section-content" id="experienceContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="education">
                <div class="resume-section-content" id="educationContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="skills">
                <div class="resume-section-content" id="skillsContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="interests">
                <div class="resume-section-content" id="interestsContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="certifications">
                <div class="resume-section-content" id="certificationsContent"><p class="lead">Loading...</p></div>
            </section>
            <hr class="m-0" />
            <section class="resume-section" id="projects">
                <div class="resume-section-content" id="projectsContent"><p class="lead">Loading...</p></div>
            </section>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        <script>
        let currentLang = 'en';
        let resumeData = null;

        function detectBrowserLang() {
            const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
            return lang === 'fr' ? 'fr' : 'en';
        }

        function loadJSON(url) {
            return fetch(url).then(r => {
                if (!r.ok) throw new Error('Failed to load ' + url);
                return r.json();
            });
        }

        function formatPeriod(period) {
            return '<span class="text-primary">' + period + '</span>';
        }

        function switchLanguage() {
            const next = currentLang === 'en' ? 'fr' : 'en';
            currentLang = next;
            document.getElementById('langToggle').textContent = next === 'en' ? 'FR' : 'EN';
            document.documentElement.lang = next;
            render();
            // Collapse navbar on mobile after language switch
            const toggler = document.querySelector('.navbar-toggler');
            const collapse = document.getElementById('navbarResponsive');
            if (toggler && collapse && window.getComputedStyle(toggler).display !== 'none') {
                const bsCollapse = bootstrap.Collapse.getInstance(collapse);
                if (bsCollapse) bsCollapse.hide();
            }
        }

        function render() {
            const suffix = currentLang === 'fr' ? '-fr' : '-en';
            loadJSON('data/resume' + suffix + '.json').then(data => {
                resumeData = data;
                document.querySelector('meta[name="description"]').content = data.meta.description;
                document.title = data.meta.title;

                // Nav
                const navList = document.getElementById('navList');
                navList.innerHTML = data.nav.items.map(item =>
                    '<li class="nav-item"><a class="nav-link js-scroll-trigger" href="#' + item.id + '">' + item.label + '</a></li>'
                ).join('');

                // About
                const about = data.about;
                document.getElementById('aboutContent').innerHTML = `
                    <h1 class="mb-0">
                        ${about.firstName}
                        <span class="text-primary">${about.lastName}</span>
                    </h1>
                    <div class="subheading mb-5">
                        ${about.location} -
                        <a href="mailto:${about.email}">${about.email}</a>
                    </div>
                    <p class="lead mb-5">${about.bio}</p>
                    <div class="social-icons">
                        <a class="social-icon" href="${about.linkedin}"><i class="fab fa-linkedin-in"></i></a>
                        <a class="social-icon" href="${about.github}"><i class="fab fa-github"></i></a>
                    </div>
                `;

                // Experience
                const expContainer = document.getElementById('experienceContent');
                expContainer.innerHTML = '<h2 class="mb-5">' + data.nav.items.find(i => i.id === 'experience').label + '</h2>' +
                    data.experience.map(job =>
                        '<div class="d-flex flex-column flex-md-row justify-content-between mb-5">' +
                            '<div class="flex-grow-1">' +
                                '<h3 class="mb-0">' + job.title + '</h3>' +
                                '<div class="subheading mb-3">' + job.company + '</div>' +
                                '<ul>' + job.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>' +
                            '</div>' +
                            '<div class="flex-shrink-0">' + formatPeriod(job.period) + '</div>' +
                        '</div>'
                    ).join('');

                // Education
                const eduContainer = document.getElementById('educationContent');
                const eduLabel = data.nav.items.find(i => i.id === 'education').label;
                eduContainer.innerHTML = '<h2 class="mb-5">' + eduLabel + '</h2>' +
                    data.education.map(edu =>
                        '<div class="d-flex flex-column flex-md-row justify-content-between mb-5">' +
                            '<div class="flex-grow-1">' +
                                '<h3 class="mb-0">' + edu.school + '</h3>' +
                                '<div class="subheading mb-3">' + edu.degree + '</div>' +
                                '<p>' + edu.detail + '</p>' +
                                '<ul>' + edu.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>' +
                            '</div>' +
                            '<div class="flex-shrink-0">' + formatPeriod(edu.period) + '</div>' +
                        '</div>'
                    ).join('');

                // Formations
                if (data.formations && data.formations.length > 0) {
                    const formLabel = currentLang === 'fr' ? 'Formations professionnelles' : 'Professional Training';
                    eduContainer.innerHTML +=
                        '<h3 class="mb-3 mt-4">' + formLabel + '</h3>' +
                        data.formations.map(f =>
                            '<div class="formation-card d-flex flex-column flex-md-row justify-content-between">' +
                                '<div class="flex-grow-1">' +
                                    '<h3 class="mb-0">' + f.title + '</h3>' +
                                    '<div class="subheading mb-2">' + f.provider + '</div>' +
                                    '<p>' + f.detail + (f.url ? ' <a href="' + f.url + '" target="_blank">' + f.url + '</a>' : '') + '</p>' +
                                '</div>' +
                                '<div class="flex-shrink-0">' + formatPeriod(f.period) + '</div>' +
                            '</div>'
                        ).join('');
                }

                // Skills
                const skillsContainer = document.getElementById('skillsContent');
                const skillsLabel = data.nav.items.find(i => i.id === 'skills').label;
                skillsContainer.innerHTML = '<h2 class="mb-5">' + skillsLabel + '</h2>' +
                    data.skills.groups.map(g =>
                        '<div class="subheading mb-3">' + g.title + '</div>' +
                        '<ul class="fa-ul mb-4">' +
                            g.items.map(item => '<li><span class="fa-li"><i class="fas fa-check"></i></span>' + item + '</li>').join('') +
                        '</ul>'
                    ).join('');

                // Interests
                const interestsContainer = document.getElementById('interestsContent');
                const interestsLabel = data.nav.items.find(i => i.id === 'interests').label;
                interestsContainer.innerHTML = '<h2 class="mb-5">' + interestsLabel + '</h2>' +
                    data.interests.map(p => '<p' + (data.interests.indexOf(p) === data.interests.length - 1 ? ' class="mb-0"' : '') + '>' + p + '</p>').join('');

                // Certifications
                const certContainer = document.getElementById('certificationsContent');
                const certLabel = data.nav.items.find(i => i.id === 'certifications').label;
                certContainer.innerHTML = '<h2 class="mb-5">' + certLabel + '</h2>' +
                    '<ul class="fa-ul mb-0">' +
                    data.certifications.map(c =>
                        '<li><span class="fa-li"><i class="fas fa-trophy text-warning"></i></span>' + c.name + '</li>'
                    ).join('') +
                    '</ul>';

                // Projects
                const projectsContainer = document.getElementById('projectsContent');
                const projectsLabel = data.nav.items.find(i => i.id === 'projects').label;
                projectsContainer.innerHTML = '<h2 class="mb-5">' + projectsLabel + '</h2>' +
                    data.projects.map(p =>
                        '<div class="project-card mb-4">' +
                            '<h3 class="mb-0">' + p.title + '</h3>' +
                            '<div class="subheading text-primary mb-2">' + p.stack + '</div>' +
                            '<p>' + p.description + '</p>' +
                            (p.url ? '<p><a href="' + p.url + '" target="_blank"><i class="fab fa-github"></i> ' + p.urlLabel + '</a></p>' : '') +
                            (p.articleUrl ? '<p><a href="' + p.articleUrl + '" target="_blank"><i class="fas fa-newspaper"></i> ' + p.articleLabel + '</a></p>' : '') +
                        '</div>' +
                        (data.projects.indexOf(p) < data.projects.length - 1 ? '<hr class="m-0 mb-4" />' : '')
                    ).join('');

                // ScrollSpy initialization / refresh
                const sideNav = document.querySelector('#sideNav');
                if (sideNav) {
                    const existingSpy = bootstrap.ScrollSpy.getInstance(document.body);
                    if (existingSpy) {
                        existingSpy.refresh();
                    } else {
                        new bootstrap.ScrollSpy(document.body, {
                            target: '#sideNav',
                            rootMargin: '0px 0px -40%',
                        });
                    }
                }

                // Re-bind scroll-trigger clicks
                document.querySelectorAll('.js-scroll-trigger').forEach(trigger => {
                    trigger.addEventListener('click', function(e) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                });
            });
        }

        function downloadMD() {
            const d = resumeData;
            if (!d) return;

            function esc(t) { return t.replace(/\*/g, '\\*').replace(/_/g, '\\_').replace(/`/g, '\\`'); }

            let md = '# ' + d.about.firstName + ' ' + d.about.lastName + '\n\n';
            md += '**' + d.about.location + '**  \n';
            md += '<' + d.about.email + '>  \n';
            md += '[LinkedIn](' + d.about.linkedin + ') | [GitHub](' + d.about.github + ')\n\n';
            md += d.about.bio + '\n\n---\n\n';

            // Experience
            const expLabel = d.nav.items.find(i => i.id === 'experience').label;
            md += '## ' + expLabel + '\n\n';
            d.experience.forEach(job => {
                md += '### ' + job.title + '\n\n';
                md += '**' + job.company + '**  \n';
                md += job.period + '\n\n';
                job.bullets.forEach(b => {
                    const clean = b.replace(/<\/?strong>/g, '**').replace(/<\/?[^>]+>/g, '');
                    md += '- ' + clean + '\n';
                });
                md += '\n';
            });

            // Education
            const eduLabel = d.nav.items.find(i => i.id === 'education').label;
            md += '---\n\n## ' + eduLabel + '\n\n';
            d.education.forEach(edu => {
                md += '### ' + edu.school + '\n\n';
                md += '**' + edu.degree + '**  \n';
                md += edu.detail + '  \n';
                md += edu.period + '\n\n';
                edu.bullets.forEach(b => md += '- ' + b + '\n');
                md += '\n';
            });

            // Formations
            if (d.formations && d.formations.length > 0) {
                const formLabel = currentLang === 'fr' ? 'Formations professionnelles' : 'Professional Training';
                md += '### ' + formLabel + '\n\n';
                d.formations.forEach(f => {
                    md += '**' + f.title + '**  \n';
                    md += f.provider + '  \n';
                    md += f.detail + '  \n';
                    md += f.period + '\n';
                    if (f.url) md += '<' + f.url + '>\n';
                    md += '\n';
                });
            }

            // Skills
            const skillsLabel = d.nav.items.find(i => i.id === 'skills').label;
            md += '---\n\n## ' + skillsLabel + '\n\n';
            d.skills.groups.forEach(g => {
                md += '### ' + g.title + '\n\n';
                g.items.forEach(item => md += '- ' + item + '\n');
                md += '\n';
            });

            // Certifications
            const certLabel = d.nav.items.find(i => i.id === 'certifications').label;
            md += '---\n\n## ' + certLabel + '\n\n';
            d.certifications.forEach(c => md += '- ' + c.name + '\n');

            // Projects
            const projLabel = d.nav.items.find(i => i.id === 'projects').label;
            md += '\n---\n\n## ' + projLabel + '\n\n';
            d.projects.forEach(p => {
                md += '### ' + p.title + '\n\n';
                md += '**' + p.stack + '**  \n\n';
                md += p.description + '\n\n';
                if (p.url) md += 'GitHub: <' + p.url + '>\n';
                if (p.articleUrl) md += 'Article: <' + p.articleUrl + '>\n';
                md += '\n';
            });

            // Download
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Alexis-Carella-CV-' + currentLang.toUpperCase() + '.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        // Initial render
        currentLang = detectBrowserLang();
        document.getElementById('langToggle').textContent = currentLang === 'en' ? 'FR' : 'EN';
        document.documentElement.lang = currentLang;
        render();
        </script>
    </body>
</html>
